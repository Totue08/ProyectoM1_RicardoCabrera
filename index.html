
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colorfly Studio | Generador de colores</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Colorfly Studio</h1>
        <p>Genera combinaciones de colores para tus ideas creativas.</p>
    </header>

    <main>

        <section class="generator">
            <h2>Generador de paletas</h2>

            <p>Descubre nuevas combinaciones de colores con un solo clic.</p>

            <label for="cantidadColores">Cantidad de colores:</label>
            <input type="number" id="cantidadColores" min="2" max="10" value="5">

            <button id="generarBtn" type="button">
                Generar paleta de color
            </button>
        </section>

        <section class="palette" aria-label="Paleta de colores generada">
        </section>
    </main>
</body>
</html>
